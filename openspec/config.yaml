schema: spec-driven

context: |
  Proyecto: Soluciones.

  Tecnologías aprobadas:
  - Frontend: Angular
  - Backend: Spring Boot
  - Base de datos: PostgreSQL

  Arquitectura:
  - Hexagonal
  - Separación entre dominio,
    aplicación e infraestructura

  Infraestructura:
  - Desarrollo local mediante Docker Compose

  Restricciones:
  - No cambiar tecnologías sin aprobación.
  - Mantener las reglas de negocio en el dominio.
  - Incluir pruebas automatizadas.
  - Documentar las decisiones técnicas.